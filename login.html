<!DOCTYPE html>
<html>
    <head>
        <title>Welcome ♡</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="login-page">
        <div class="login-card">
            <div class="login-icon">♡</div>
            
            <h1>Welcome!</h1>
            <p>Come and explore my photography collection.</p>

            <form action="home.html" method="get">
                <label for="visitors">Your Name</label>
                <input 
                type="text"
                id="visitor"
                name="visitor"
                placeholder="Enter your name..."
                required>

                <button type="submit" class="login-button">
                    Start Exploring ✧
                </button>
             </form>

             <p class="login-note">Take a moment, stay a while ♡</p>
        </div>
    </body>

</html>
